name: Deploy Supabase Edge Functions

# AI 서버 함수(supabase/functions)를 Supabase에 올린다.
# GitHub 저장소 Settings → Secrets에 SUPABASE_ACCESS_TOKEN이 있을 때만 실제로 올리고, 없으면 건너뛴다.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fzqbbazuqolefhsinlit
    steps:
      - name: 토큰이 없으면 건너뛰기
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN이 없어 함수 배포를 건너뜁니다."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.120.0
      # 로그인 확인은 함수 코드가 직접 한다(publishable key는 JWT가 아니어서 게이트 검사를 끈다)
      - name: 함수 배포
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
