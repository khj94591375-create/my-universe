name: Test

# 단위 테스트 + 화면 테스트(e2e). PR마다 돌고, 배포(deploy.yml) 전에도 반드시 통과해야 한다.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사 + 단위 테스트
        run: |
          npm run typecheck
          npm test
      - name: 화면 테스트용 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 화면 테스트(e2e)
        run: npm run e2e
        env:
          CI: 'true'
      - name: 실패하면 결과 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
