name: Test

# 단위 테스트 + 화면 테스트(e2e). PR마다 돌고, 배포(deploy.yml) 전에도 반드시 통과해야 한다.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사 + 단위 테스트
        run: |
          npm run typecheck
          npm test
      - name: 화면 테스트용 브라우저 설치
        # 우분투 패키지 서버에 잠깐 닿지 않을 때가 있어(DNS 오류) 한 번 더 시도하고, 그래도 안 되면 브라우저만 설치한다(실행 컴퓨터에 필요한 라이브러리는 대부분 이미 있음)
        run: |
          npx playwright install --with-deps chromium || (sleep 30 && npx playwright install --with-deps chromium) || npx playwright install chromium
      - name: 화면 테스트(e2e)
        run: npm run e2e
        env:
          CI: 'true'
      - name: 실패하면 결과 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
